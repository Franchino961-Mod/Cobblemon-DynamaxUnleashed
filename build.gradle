plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
    id 'architectury-plugin' version '3.4-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.impactdev.net/repository/development/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.wispforest.io/releases/' }
}

dependencies {
    // Minecraft & Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    
    // Architectury API
    modImplementation "dev.architectury:architectury-fabric:${project.architectury_version}"
    
    // Cobblemon (includes Kotlin)
    modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"
    
    // Kotlin standard library (needed for Cobblemon integration)
    modImplementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.23"
    
    // Accessories (for Dynamax Band support)
    modImplementation "io.wispforest:accessories-fabric:${project.accessories_version}"
}

processResources {
    inputs.property "version", project.version
    
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}
