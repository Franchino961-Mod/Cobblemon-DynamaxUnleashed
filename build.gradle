plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

version = project.mod_version
archivesBaseName = "${project.archives_base_name}-fabric-mc${project.minecraft_version}"
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = 'https://maven.impactdev.net/repository/development/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.wispforest.io/releases/' }
}

dependencies {
    // Minecraft & Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    
    // Architectury API
    modImplementation "dev.architectury:architectury-fabric:${project.architectury_version}"
    
    // Cobblemon (already includes Kotlin as transitive dependency)
    modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"
    
    // Kotlin stdlib (needed for compile-time references like kotlin.Unit in InteractionGUIHandler)
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    
    // Accessories (for Dynamax Band support)
    modImplementation "io.wispforest:accessories-fabric:${project.accessories_version}"
}

processResources {
    inputs.property "version", project.version
    
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}

// Helper function to extract only the latest version's changelog from Docs/CHANGELOG.en.md
def getLatestChangelog() {
    def changelogFile = file('Docs/CHANGELOG.en.md')
    if (!changelogFile.exists()) return "No changelog found."
    def lines = changelogFile.readLines()
    def content = []
    def recording = false
    for (line in lines) {
        if (line.startsWith("## [")) {
            if (recording) {
                break // Found previous version, stop
            }
            recording = true
            content.add(line)
            continue
        }
        if (recording) {
            if (line.trim() == "---") {
                break
            }
            content.add(line)
        }
    }
    return content.join("\n").trim()
}

publishMods {
    file = tasks.named('remapJar').flatMap { it.archiveFile }
    changelog = getLatestChangelog()
    type = STABLE
    
    def curseToken = providers.environmentVariable("CURSEFORGE_TOKEN").orNull
    if (curseToken && !curseToken.trim().isEmpty() && project.findProperty("curseforge_project_id")) {
        curseforge {
            accessToken = curseToken
            projectId = project.findProperty("curseforge_project_id")
            minecraftVersions.add(project.minecraft_version)
            modLoaders.add("fabric")
            javaVersions.add(JavaVersion.VERSION_21)
            displayName = "${project.mod_name} - ${project.mod_version}"
            changelogType = "markdown"
            
            clientRequired = true
            serverRequired = true
        }
    }
}

